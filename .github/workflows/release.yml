name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            goos: darwin
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
          - os: windows-11-arm
            goos: windows
            goarch: arm64
          - os: ubuntu-24.04
            goos: linux
            goarch: amd64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install Linux audio dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev pkg-config
      - name: Test
        run: go test ./...
      - name: Build
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          binary=arcana-toc
          if [ "$GOOS" = windows ]; then binary=arcana-toc.exe; fi
          mkdir -p package
          go build -trimpath -ldflags "-s -w -X github.com/LingLambda/arcana-toc/internal/version.Version=$TAG -X github.com/LingLambda/arcana-toc/internal/version.Commit=$COMMIT" -o "package/$binary" ./cmd/arcana-toc
          cp LICENSE package/
          "./package/$binary" --version
          "./package/$binary" --help
      - name: Smoke service
        run: |
          python - <<'PY'
          import json, os, pathlib, socket, subprocess, tempfile, time, urllib.request
          binary = pathlib.Path('package/arcana-toc' + ('.exe' if os.name == 'nt' else '')).resolve()
          with tempfile.TemporaryDirectory() as directory:
              with socket.socket() as listener:
                  listener.bind(('127.0.0.1', 0))
                  port = listener.getsockname()[1]
              config = pathlib.Path(directory) / 'config.yaml'
              config.write_text(f'server:\n  port: {port}\ndata_dir: ./data\n')
              process = subprocess.Popen([str(binary), '--config', str(config)])
              try:
                  for attempt in range(100):
                      if process.poll() is not None:
                          raise RuntimeError(f'service exited: {process.returncode}')
                      try:
                          with urllib.request.urlopen(f'http://127.0.0.1:{port}/healthz', timeout=1) as response:
                              assert json.load(response)['status'] == 'ok'
                          break
                      except OSError:
                          time.sleep(0.1)
                  else:
                      raise RuntimeError('service startup timed out')
              finally:
                  process.terminate()
                  process.wait(timeout=15)
          PY
      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, pathlib, tarfile, zipfile
          name = f"arcana-toc-{os.environ['TAG']}-{os.environ['GOOS']}-{os.environ['GOARCH']}"
          pathlib.Path('dist').mkdir()
          files = sorted(pathlib.Path('package').iterdir())
          if os.environ['GOOS'] == 'windows':
              with zipfile.ZipFile(f'dist/{name}.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
                  for file in files:
                      archive.write(file, file.name)
          else:
              with tarfile.open(f'dist/{name}.tar.gz', 'w:gz') as archive:
                  for file in files:
                      archive.add(file, arcname=file.name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: arcana-toc-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes ""
    if: startsWith(github.ref, 'refs/tags/')
